<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>今日搭配 - WARDROBE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif;
  background: #E8E8E8;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.app {
  max-width: 390px;
  width: 100%;
  background: #fff;
  min-height: 100vh;
  position: relative;
  padding-bottom: 80px;
}

/* 顶部导航 */
.header {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 48px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  border-bottom: 1px solid #F0F0F0;
}
.header h1 {
  font-size: 16px;
  font-weight: 300;
  letter-spacing: 0.3em;
  color: #000;
}

/* 内容区 */
.content {
  padding-top: 58px;
}

/* 小标题 */
.section-title {
  font-size: 12px;
  color: #999;
  margin-bottom: 10px;
}

/* === 场合选择 === */
.occasion-section { padding: 16px; }
.tags-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tags-scroll::-webkit-scrollbar { display: none; }
.tag {
  flex-shrink: 0;
  padding: 6px 14px;
  font-size: 13px;
  border: 1px solid #E0E0E0;
  border-radius: 20px;
  color: #333;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.tag.active {
  background: #000;
  color: #fff;
  border-color: #000;
}
.custom-input {
  width: 100%;
  margin-top: 10px;
  border: none;
  border-bottom: 1px solid #E0E0E0;
  padding: 8px 0;
  font-size: 14px;
  font-weight: 300;
  color: #000;
  outline: none;
  background: transparent;
}
.custom-input::placeholder { color: #BBB; }

/* === 天气卡片 === */
.weather-card-section { padding: 0 16px 16px; }
.weather-card {
  background: linear-gradient(135deg, #FFF0EC 0%, #FFF5F0 50%, #FFF8F5 100%);
  border-radius: 16px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: opacity 0.2s;
}
.weather-card:active { opacity: 0.85; }
.weather-card-left { flex: 1; }
.weather-city-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 8px;
  font-size: 13px;
  color: #888;
}
.weather-city-icon { font-size: 13px; }
.weather-city-name { color: #555; font-weight: 400; }
.weather-city-dot { color: #CCC; }
.weather-city-today { color: #888; }
.weather-city-arrow { font-size: 11px; color: #AAA; margin-left: 2px; }
.weather-temp {
  font-size: 28px;
  font-weight: 300;
  color: #1A1A1A;
  line-height: 1.2;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.weather-desc { font-size: 12px; color: #999; }
.weather-card-right { flex-shrink: 0; }
.weather-icon { font-size: 40px; line-height: 1; }

/* 城市选择弹窗 */
.city-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 300;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.city-overlay.open { opacity: 1; pointer-events: auto; }
.city-modal {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -45%);
  width: calc(100% - 48px);
  max-width: 342px;
  background: #fff;
  border-radius: 20px;
  padding: 24px 20px 20px;
  z-index: 301;
  opacity: 0; pointer-events: none;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.city-modal.open {
  opacity: 1; pointer-events: auto;
  transform: translate(-50%, -50%);
}
.city-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.city-modal-title { font-size: 18px; font-weight: 600; color: #1A1A1A; }
.city-modal-close { font-size: 20px; color: #999; cursor: pointer; padding: 4px; }
.city-search-input {
  width: 100%; height: 48px; padding: 0 16px;
  border: 1.5px solid #E8805A; border-radius: 12px;
  font-size: 15px; font-weight: 300; color: #1A1A1A;
  outline: none; background: #fff; margin-bottom: 12px;
  font-family: inherit;
}
.city-search-input::placeholder { color: #BBB; }
.city-locate-btn {
  width: 100%; height: 48px;
  background: #fff; border: 1.5px solid #E8805A; border-radius: 12px;
  color: #E8805A; font-size: 15px; font-weight: 400; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: background 0.15s;
}
.city-locate-btn:active { background: #FFF5F2; }
.city-locate-btn.loading { color: #CCC; border-color: #E0E0E0; pointer-events: none; }

/* === 指定单品 === */
.pickup-section { padding: 0 16px 16px; }
.pickup-btn {
  width: 100%;
  height: 44px;
  background: #F5F5F5;
  border: 1px dashed #CCC;
  border-radius: 8px;
  font-size: 14px;
  color: #666;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.2s;
}
.pickup-btn:active { background: #EEE; }
.pickup-selected {
  margin-top: 8px;
  display: none;
  padding: 8px 12px;
  background: #F9F9F9;
  border-radius: 6px;
  align-items: center;
  gap: 8px;
}
.pickup-selected.show { display: flex; }
.pickup-swatch {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 1px solid #E0E0E0;
  flex-shrink: 0;
}
.pickup-name { font-size: 13px; color: #333; }
.pickup-remove {
  margin-left: auto;
  font-size: 18px;
  color: #999;
  cursor: pointer;
  padding: 0 4px;
}

/* 底部抽屉 */
.drawer-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.drawer-panel {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 390px;
  max-height: 60vh;
  background: #fff;
  border-radius: 16px 16px 0 0;
  padding: 20px;
  z-index: 201;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
}
.drawer-panel.open {
  transform: translateX(-50%) translateY(0);
}
.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.drawer-header h3 { font-size: 16px; font-weight: 600; }
.drawer-close { font-size: 20px; cursor: pointer; color: #999; padding: 4px; }
.drawer-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.drawer-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  padding: 8px;
  border: 2px solid transparent;
  border-radius: 8px;
  transition: border-color 0.2s;
}
.drawer-item.selected { border-color: #000; }
.drawer-item .swatch {
  width: 60px;
  height: 80px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.drawer-item .name {
  font-size: 12px;
  color: #666;
  text-align: center;
}
.drawer-confirm {
  margin-top: 16px;
  width: 100%;
  height: 44px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
.drawer-confirm:disabled { background: #CCC; cursor: default; }

/* === AI 搭配按钮 === */
.ai-btn {
  display: block;
  width: calc(100% - 32px);
  margin: 0 16px 16px;
  height: 50px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.ai-btn:active { opacity: 0.8; }

/* === 搭配结果 === */
.result-section { padding: 0 16px; }

/* 状态一 */
.result-empty {
  text-align: center;
  padding: 48px 0;
}
.result-empty .icon { font-size: 48px; margin-bottom: 12px; }
.result-empty .text { font-size: 14px; color: #BBB; }

/* 状态二 loading */
.result-loading { display: none; }
.skeleton {
  height: 120px;
  border-radius: 8px;
  background: linear-gradient(90deg, #F0F0F0 25%, #E0E0E0 50%, #F0F0F0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  margin-bottom: 12px;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* 状态三 结果 */
.result-content { display: none; }
.result-summary {
  font-size: 12px;
  color: #999;
  margin-bottom: 12px;
}
.plan-card {
  border: 1px solid #E0E0E0;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  transition: all 0.25s;
}
.plan-card.selected {
  border: 2px solid #000;
}
.plan-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.plan-title { font-size: 14px; font-weight: 700; }
.plan-select-btn {
  font-size: 12px;
  padding: 6px 14px;
  background: #fff;
  color: #000;
  border: 1px solid #000;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.plan-select-btn.is-selected {
  background: #000;
  color: #fff;
}
.plan-items {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.plan-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.plan-swatch {
  width: 48px;
  height: 64px;
  border-radius: 6px;
  border: 1px solid #F0F0F0;
}
.plan-item-name {
  font-size: 10px;
  color: #999;
  margin-top: 4px;
  text-align: center;
  max-width: 56px;
  line-height: 1.2;
}
.plan-reason {
  font-size: 12px;
  color: #666;
  line-height: 1.6;
}

/* 收藏按钮 */
.favorite-btn {
  display: none;
  width: 100%;
  height: 44px;
  background: #fff;
  color: #000;
  border: 1px solid #000;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  margin-top: 8px;
  margin-bottom: 20px;
  transition: all 0.2s;
}
.favorite-btn.saved {
  color: #999;
  border-color: #CCC;
  cursor: default;
}

/* 绿色提示条 */
.toast-success {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #4CAF50;
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 150;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast-success.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 底部Tab */
.bottom-tab {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 64px;
  background: #fff;
  border-top: 1px solid #F0F0F0;
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  font-size: 10px;
  color: #999;
  padding: 4px 12px;
  cursor: pointer;
}
.tab-item .icon { font-size: 22px; margin-bottom: 2px; }
.tab-item.active { color: #000; }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部导航 -->
  <header class="header">
    <h1>WARDROBE</h1>
  </header>

  <!-- 内容区 -->
  <div class="content">

    <!-- 1. 场合选择 -->
    <div class="occasion-section">
      <div class="section-title">今天去哪里？</div>
      <div class="tags-scroll" id="occasionTags">
        <span class="tag" data-val="日常">日常</span>
        <span class="tag active" data-val="职场">职场</span>
        <span class="tag" data-val="约会">约会</span>
        <span class="tag" data-val="聚会">聚会</span>
        <span class="tag" data-val="运动">运动</span>
      </div>
      <input class="custom-input" id="customOccasion" type="text" placeholder="或输入自定义场景，如：参加朋友婚礼、海边旅行…">
    </div>

    <!-- 2. 天气卡片 -->
    <div class="weather-card-section">
      <div class="weather-card" id="weatherCard">
        <div class="weather-card-left">
          <div class="weather-city-row">
            <span class="weather-city-icon">⊙</span>
            <span class="weather-city-name" id="weatherCityName">上海</span>
            <span class="weather-city-dot">·</span>
            <span class="weather-city-today">今日</span>
            <span class="weather-city-arrow">∨</span>
          </div>
          <div class="weather-temp" id="weatherTemp">16° / 25°</div>
          <div class="weather-desc" id="weatherDesc">多云 · UV 中</div>
        </div>
        <div class="weather-card-right">
          <div class="weather-icon" id="weatherIcon">⛅</div>
        </div>
      </div>
    </div>

    <!-- 城市选择弹窗 -->
    <div class="city-overlay" id="cityOverlay"></div>
    <div class="city-modal" id="cityModal">
      <div class="city-modal-header">
        <span class="city-modal-title">选择城市</span>
        <span class="city-modal-close" id="cityClose">✕</span>
      </div>
      <input class="city-search-input" id="citySearchInput" type="text" placeholder="搜索城市，如 北京 / Tokyo" autocomplete="off">
      <button class="city-locate-btn" id="cityLocateBtn">⊙ 使用当前定位</button>
    </div>

    <!-- 3. 指定单品 -->
    <div class="pickup-section">
      <div class="section-title">想穿某件？（可选）</div>
      <button class="pickup-btn" id="pickupBtn">+ 从衣橱选择</button>
      <div class="pickup-selected" id="pickupSelected">
        <span class="pickup-swatch" id="pickupSwatch"></span>
        <span class="pickup-name" id="pickupName"></span>
        <span class="pickup-remove" id="pickupRemove">×</span>
      </div>
    </div>

    <!-- 4. AI 搭配按钮 -->
    <button class="ai-btn" id="aiBtn">✨ AI 帮我搭配</button>

    <!-- 5. 搭配结果 -->
    <div class="result-section">
      <div class="result-empty" id="resultEmpty">
        <div class="icon">🧥</div>
        <div class="text">选好条件，开始搭配</div>
      </div>
      <div class="result-loading" id="resultLoading">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
      <div class="result-content" id="resultContent">
        <div class="result-summary" id="resultSummary"></div>
        <div id="planCards"></div>
        <button class="favorite-btn" id="favoriteBtn">❤️ 收藏当前搭配</button>
      </div>
    </div>

  </div>

  <!-- 底部Tab -->
  <nav class="bottom-tab">
    <a class="tab-item" href="index.html">
      <span class="icon">👗</span>
      <span>衣橱</span>
    </a>
    <a class="tab-item active" href="outfit.html">
      <span class="icon">✨</span>
      <span>搭配</span>
    </a>
    <a class="tab-item" href="shop.html">
      <span class="icon">🛍</span>
      <span>购物</span>
    </a>
    <a class="tab-item" href="favorites.html">
      <span class="icon">❤️</span>
      <span>收藏</span>
    </a>
  </nav>

  <!-- 底部抽屉 -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer-panel" id="drawerPanel">
    <div class="drawer-header">
      <h3>选择单品</h3>
      <span class="drawer-close" id="drawerClose">✕</span>
    </div>
    <div class="drawer-grid" id="drawerGrid"></div>
    <button class="drawer-confirm" id="drawerConfirm" disabled>确认选择</button>
  </div>

  <!-- 绿色提示条 -->
  <div class="toast-success" id="toastSuccess">✓ 今日穿搭已记录</div>
</div>

<script>
// ============ 数据 ============
const mockItems = [
  { name: '白色衬衫', color: '#E8E8E8' },
  { name: '灰色卫衣', color: '#9E9E9E' },
  { name: '黑色西裤', color: '#2C2C2C' },
  { name: '深蓝牛仔裤', color: '#2B4B7A' },
  { name: '切尔西靴', color: '#1A1A1A' },
  { name: '帆布鞋', color: '#F5F5DC' }
];

const plans = [
  {
    name: '方案一',
    items: [
      { name: '白色衬衫', color: '#E8E8E8' },
      { name: '黑色西裤', color: '#2C2C2C' },
      { name: '切尔西靴', color: '#1A1A1A' }
    ],
    reason: '经典黑白组合，职场首选，干净利落'
  },
  {
    name: '方案二',
    items: [
      { name: '灰色卫衣', color: '#9E9E9E' },
      { name: '深蓝牛仔裤', color: '#2B4B7A' },
      { name: '切尔西靴', color: '#1A1A1A' }
    ],
    reason: '休闲商务风，舒适不失整洁'
  },
  {
    name: '方案三',
    items: [
      { name: '白色衬衫', color: '#E8E8E8' },
      { name: '深蓝牛仔裤', color: '#2B4B7A' },
      { name: '切尔西靴', color: '#1A1A1A' }
    ],
    reason: '轻松通勤感，衬衫扎进裤腰可提升正式感'
  }
];

// ============ 状态 ============
let selectedOccasion = '职场';
let customOccasion = '';
let selectedWeather = '多云';
let selectedTemp = '16-25°';
let weatherCity = '上海';
let selectedItem = null;
let selectedPlan = null;
let isFavorited = false;

// ============ DOM ============
const occasionTagsEl = document.getElementById('occasionTags');
const customInput = document.getElementById('customOccasion');
const pickupBtn = document.getElementById('pickupBtn');
const pickupSelectedEl = document.getElementById('pickupSelected');
const pickupSwatchEl = document.getElementById('pickupSwatch');
const pickupNameEl = document.getElementById('pickupName');
const pickupRemove = document.getElementById('pickupRemove');
const aiBtn = document.getElementById('aiBtn');
const resultEmpty = document.getElementById('resultEmpty');
const resultLoading = document.getElementById('resultLoading');
const resultContent = document.getElementById('resultContent');
const resultSummary = document.getElementById('resultSummary');
const planCards = document.getElementById('planCards');
const favoriteBtn = document.getElementById('favoriteBtn');
const toastSuccess = document.getElementById('toastSuccess');
const drawerOverlay = document.getElementById('drawerOverlay');
const drawerPanel = document.getElementById('drawerPanel');
const drawerClose = document.getElementById('drawerClose');
const drawerGrid = document.getElementById('drawerGrid');
const drawerConfirm = document.getElementById('drawerConfirm');

// ============ 场合标签 ============
occasionTagsEl.addEventListener('click', (e) => {
  const tag = e.target.closest('.tag');
  if (!tag) return;
  // 清空自定义输入
  customInput.value = '';
  customOccasion = '';
  // 切换选中
  occasionTagsEl.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
  tag.classList.add('active');
  selectedOccasion = tag.dataset.val;
});

// ============ 自定义输入 ============
customInput.addEventListener('input', (e) => {
  const val = e.target.value.trim();
  customOccasion = val;
  if (val) {
    occasionTagsEl.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    selectedOccasion = val;
  }
});

// ============ 天气卡片 & 城市弹窗 ============
const weatherCard = document.getElementById('weatherCard');
const cityOverlay = document.getElementById('cityOverlay');
const cityModal = document.getElementById('cityModal');
const cityClose = document.getElementById('cityClose');
const citySearchInput = document.getElementById('citySearchInput');
const cityLocateBtn = document.getElementById('cityLocateBtn');
const weatherCityName = document.getElementById('weatherCityName');
const weatherTemp = document.getElementById('weatherTemp');
const weatherDesc = document.getElementById('weatherDesc');
const weatherIcon = document.getElementById('weatherIcon');

// 打开城市选择弹窗
weatherCard.addEventListener('click', () => {
  citySearchInput.value = '';
  cityOverlay.classList.add('open');
  cityModal.classList.add('open');
  setTimeout(() => citySearchInput.focus(), 300);
});

function closeCityModal() {
  cityOverlay.classList.remove('open');
  cityModal.classList.remove('open');
}
cityClose.addEventListener('click', closeCityModal);
cityOverlay.addEventListener('click', closeCityModal);

// 搜索城市（按回车/失焦）
citySearchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const city = citySearchInput.value.trim();
    if (city) { fetchWeatherByCity(city); closeCityModal(); }
  }
});

// 使用当前定位
cityLocateBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    showToast('浏览器不支持定位');
    return;
  }
  cityLocateBtn.textContent = '定位中...';
  cityLocateBtn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(4);
      const lon = pos.coords.longitude.toFixed(4);
      closeCityModal();
      fetchWeatherByCoords(lat, lon);
    },
    () => {
      cityLocateBtn.textContent = '⊙ 使用当前定位';
      cityLocateBtn.classList.remove('loading');
      showToast('无法获取定位，请手动搜索城市');
    },
    { timeout: 8000 }
  );
});

function fetchWeatherByCity(city) {
  fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`)
    .then(r => r.json())
    .then(data => applyWeatherData(data, city))
    .catch(() => showToast('城市天气获取失败，请重试'));
}

function fetchWeatherByCoords(lat, lon) {
  fetch(`https://wttr.in/${lat},${lon}?format=j1`)
    .then(r => r.json())
    .then(data => {
      const area = data.nearest_area?.[0];
      const city = area?.areaName?.[0]?.value || '当前位置';
      applyWeatherData(data, city);
      cityLocateBtn.textContent = '⊙ 使用当前定位';
      cityLocateBtn.classList.remove('loading');
    })
    .catch(() => {
      showToast('天气获取失败，请重试');
      cityLocateBtn.textContent = '⊙ 使用当前定位';
      cityLocateBtn.classList.remove('loading');
    });
}

function applyWeatherData(data, city) {
  const c = data.current_condition[0];
  const minTemp = data.weather?.[0]?.mintempC || c.temp_C;
  const maxTemp = data.weather?.[0]?.maxtempC || c.temp_C;
  const desc = c.weatherDesc[0].value;

  weatherCity = city;
  weatherCityName.textContent = city;
  weatherTemp.textContent = `${minTemp}° / ${maxTemp}°`;

  // UV 判断
  const uv = parseInt(c.uvIndex || 0);
  const uvText = uv >= 8 ? 'UV 极强' : uv >= 6 ? 'UV 强' : uv >= 3 ? 'UV 中' : 'UV 低';

  // 天气中文描述
  let zhDesc, icon;
  if (/rain|drizzle/i.test(desc)) {
    zhDesc = '有雨'; icon = '🌧'; selectedWeather = '雨天';
  } else if (/snow/i.test(desc)) {
    zhDesc = '有雪'; icon = '❄️'; selectedWeather = '阴天';
  } else if (/thunder/i.test(desc)) {
    zhDesc = '雷雨'; icon = '⛈'; selectedWeather = '雨天';
  } else if (/overcast/i.test(desc)) {
    zhDesc = '阴天'; icon = '☁️'; selectedWeather = '阴天';
  } else if (/cloud/i.test(desc)) {
    zhDesc = '多云'; icon = '⛅'; selectedWeather = '多云';
  } else if (/fog|mist/i.test(desc)) {
    zhDesc = '有雾'; icon = '🌫'; selectedWeather = '阴天';
  } else {
    zhDesc = '晴天'; icon = '☀️'; selectedWeather = '晴天';
  }

  weatherDesc.textContent = `${zhDesc} · ${uvText}`;
  weatherIcon.textContent = icon;

  const avg = (parseInt(minTemp) + parseInt(maxTemp)) / 2;
  if (avg < 10) selectedTemp = '＜10°';
  else if (avg < 20) selectedTemp = '10-20°';
  else if (avg < 30) selectedTemp = '20-30°';
  else selectedTemp = '＞30°';
}

// ============ 抽屉渲染 ============
function renderDrawer() {
  drawerGrid.innerHTML = mockItems.map((item, i) => `
    <div class="drawer-item" data-index="${i}">
      <div class="swatch" style="background:${item.color}"></div>
      <span class="name">${item.name}</span>
    </div>
  `).join('');
}
renderDrawer();

// 抽屉选中的 item
let drawerSelected = null;

drawerGrid.addEventListener('click', (e) => {
  const item = e.target.closest('.drawer-item');
  if (!item) return;
  const idx = parseInt(item.dataset.index);
  drawerGrid.querySelectorAll('.drawer-item').forEach(el => el.classList.remove('selected'));
  item.classList.add('selected');
  drawerSelected = mockItems[idx];
  drawerConfirm.disabled = false;
});

pickupBtn.addEventListener('click', () => {
  drawerSelected = null;
  drawerConfirm.disabled = true;
  drawerGrid.querySelectorAll('.drawer-item').forEach(el => el.classList.remove('selected'));
  drawerOverlay.classList.add('open');
  drawerPanel.classList.add('open');
});

function closeDrawer() {
  drawerOverlay.classList.remove('open');
  drawerPanel.classList.remove('open');
}
drawerClose.addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

drawerConfirm.addEventListener('click', () => {
  if (!drawerSelected) return;
  selectedItem = drawerSelected;
  pickupSwatchEl.style.background = selectedItem.color;
  pickupNameEl.textContent = selectedItem.name;
  pickupSelectedEl.classList.add('show');
  closeDrawer();
});

pickupRemove.addEventListener('click', () => {
  selectedItem = null;
  pickupSelectedEl.classList.remove('show');
});

// ============ AI 搭配 ============
aiBtn.addEventListener('click', () => {
  // 切换到 loading
  resultEmpty.style.display = 'none';
  resultContent.style.display = 'none';
  resultLoading.style.display = 'block';
  favoriteBtn.style.display = 'none';
  selectedPlan = null;
  isFavorited = false;

  setTimeout(() => {
    resultLoading.style.display = 'none';
    resultContent.style.display = 'block';
    renderResults();
  }, 1500);
});

function renderResults() {
  const occasion = customOccasion || selectedOccasion;
  resultSummary.textContent = `${occasion} · ${weatherCity} ${weatherDesc.textContent} 推荐`;

  planCards.innerHTML = plans.map((p, i) => `
    <div class="plan-card" data-plan="${i}">
      <div class="plan-header">
        <span class="plan-title">${p.name}</span>
        <button class="plan-select-btn" data-plan="${i}">选择</button>
      </div>
      <div class="plan-items">
        ${p.items.map(it => `
          <div class="plan-item">
            <div class="plan-swatch" style="background:${it.color}"></div>
            <span class="plan-item-name">${it.name}</span>
          </div>
        `).join('')}
      </div>
      <div class="plan-reason">${p.reason}</div>
    </div>
  `).join('');

  favoriteBtn.style.display = 'block';
  favoriteBtn.textContent = '❤️ 收藏当前搭配';
  favoriteBtn.classList.remove('saved');
  isFavorited = false;
}

// ============ 选择方案 ============
planCards.addEventListener('click', (e) => {
  const btn = e.target.closest('.plan-select-btn');
  if (!btn) return;
  const idx = parseInt(btn.dataset.plan);

  // 取消所有选中
  planCards.querySelectorAll('.plan-card').forEach(c => {
    c.classList.remove('selected');
    c.style.opacity = '1';
  });
  planCards.querySelectorAll('.plan-select-btn').forEach(b => {
    b.textContent = '选择';
    b.classList.remove('is-selected');
  });

  // 选中当前
  const card = planCards.querySelector(`.plan-card[data-plan="${idx}"]`);
  card.classList.add('selected');
  btn.textContent = '✓ 已选';
  btn.classList.add('is-selected');

  // 其他卡片变淡
  planCards.querySelectorAll('.plan-card').forEach(c => {
    if (c !== card) c.style.opacity = '0.5';
  });

  selectedPlan = idx;

  // 保存到 localStorage
  const occasion = customOccasion || selectedOccasion;
  const todayOutfit = {
    occasion: occasion,
    weather: selectedWeather,
    temp: selectedTemp,
    plan: plans[idx],
    selectedItem: selectedItem,
    savedAt: new Date().toISOString()
  };
  localStorage.setItem('today_outfit', JSON.stringify(todayOutfit));

  // 绿色提示条
  showToastSuccess();
});

function showToastSuccess() {
  toastSuccess.classList.add('show');
  setTimeout(() => {
    toastSuccess.classList.remove('show');
  }, 2500);
}

// ============ Toast 提示 ============
function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = `
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.75); color:#fff; padding:8px 18px;
    border-radius:16px; font-size:12px; z-index:300; white-space:nowrap;
  `;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ============ 收藏 ============
favoriteBtn.addEventListener('click', () => {
  if (isFavorited) return;
  const planIdx = selectedPlan !== null ? selectedPlan : 0;
  const plan = plans[planIdx];
  const occasion = customOccasion || selectedOccasion;

  // 推断季节
  let season = '春夏';
  if (selectedTemp === '＜10°') season = '冬季';
  else if (selectedTemp === '10-20°') season = '春秋';
  else if (selectedTemp === '＞30°') season = '盛夏';

  const favItem = {
    id: Date.now(),
    outfitName: plan.name,
    items: plan.items.map(it => ({ ...it })),
    occasion: occasion,
    weather: selectedWeather,
    tags: [occasion, season],
    savedAt: new Date().toISOString()
  };

  let favorites = [];
  try {
    favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
  } catch (e) { favorites = []; }
  favorites.push(favItem);
  localStorage.setItem('favorites', JSON.stringify(favorites));

  favoriteBtn.textContent = '已收藏 ❤️';
  favoriteBtn.classList.add('saved');
  isFavorited = true;
});
</script>
