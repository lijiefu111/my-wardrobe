<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>今日搭配 - WARDROBE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif;
  background: #E8E8E8;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.app {
  max-width: 390px;
  width: 100%;
  background: #fff;
  min-height: 100vh;
  position: relative;
  padding-bottom: 80px;
}

/* 顶部导航 */
.header {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 48px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  border-bottom: 1px solid #F0F0F0;
}
.header h1 {
  font-size: 16px;
  font-weight: 300;
  letter-spacing: 0.3em;
  color: #000;
}

/* 内容区 */
.content {
  padding-top: 58px;
}

/* 小标题 */
.section-title {
  font-size: 12px;
  color: #999;
  margin-bottom: 10px;
}

/* === 场合选择 === */
.occasion-section { padding: 16px; }
.tags-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tags-scroll::-webkit-scrollbar { display: none; }
.tag {
  flex-shrink: 0;
  padding: 6px 14px;
  font-size: 13px;
  border: 1px solid #E0E0E0;
  border-radius: 20px;
  color: #333;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.tag.active {
  background: #000;
  color: #fff;
  border-color: #000;
}
.custom-input {
  width: 100%;
  margin-top: 10px;
  border: none;
  border-bottom: 1px solid #E0E0E0;
  padding: 8px 0;
  font-size: 14px;
  font-weight: 300;
  color: #000;
  outline: none;
  background: transparent;
}
.custom-input::placeholder { color: #BBB; }

/* === 天气卡片 === */
.weather-card-section { padding: 0 16px 16px; }
.weather-card {
  background: linear-gradient(135deg, #FFF0EC 0%, #FFF5F0 50%, #FFF8F5 100%);
  border-radius: 16px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: opacity 0.2s;
}
.weather-card:active { opacity: 0.85; }
.weather-card-left { flex: 1; }
.weather-city-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 8px;
  font-size: 13px;
  color: #888;
}
.weather-city-icon { font-size: 13px; }
.weather-city-name { color: #555; font-weight: 400; }
.weather-city-dot { color: #CCC; }
.weather-city-today { color: #888; }
.weather-city-arrow { font-size: 11px; color: #AAA; margin-left: 2px; }
.weather-temp {
  font-size: 28px;
  font-weight: 300;
  color: #1A1A1A;
  line-height: 1.2;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.weather-desc { font-size: 12px; color: #999; }
.weather-card-right { flex-shrink: 0; }
.weather-icon { font-size: 40px; line-height: 1; }

/* 城市选择弹窗 */
.city-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 300;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.city-overlay.open { opacity: 1; pointer-events: auto; }
.city-modal {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -45%);
  width: calc(100% - 48px);
  max-width: 342px;
  background: #fff;
  border-radius: 20px;
  padding: 24px 20px 20px;
  z-index: 301;
  opacity: 0; pointer-events: none;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.city-modal.open {
  opacity: 1; pointer-events: auto;
  transform: translate(-50%, -50%);
}
.city-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.city-modal-title { font-size: 18px; font-weight: 600; color: #1A1A1A; }
.city-modal-close { font-size: 20px; color: #999; cursor: pointer; padding: 4px; }
.city-search-input {
  width: 100%; height: 48px; padding: 0 16px;
  border: 1.5px solid #E8805A; border-radius: 12px;
  font-size: 15px; font-weight: 300; color: #1A1A1A;
  outline: none; background: #fff; margin-bottom: 12px;
  font-family: inherit;
}
.city-search-input::placeholder { color: #BBB; }
.city-locate-btn {
  width: 100%; height: 48px;
  background: #fff; border: 1.5px solid #E8805A; border-radius: 12px;
  color: #E8805A; font-size: 15px; font-weight: 400; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: background 0.15s;
}
.city-locate-btn:active { background: #FFF5F2; }
.city-locate-btn.loading { color: #CCC; border-color: #E0E0E0; pointer-events: none; }

/* === 指定单品 === */
.pickup-section { padding: 0 16px 16px; }
.pickup-btn {
  width: 100%;
  height: 44px;
  background: #F5F5F5;
  border: 1px dashed #CCC;
  border-radius: 8px;
  font-size: 14px;
  color: #666;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.2s;
}
.pickup-btn:active { background: #EEE; }
.pickup-selected {
  margin-top: 8px;
  display: none;
  padding: 8px 12px;
  background: #F9F9F9;
  border-radius: 6px;
  align-items: center;
  gap: 8px;
}
.pickup-selected.show { display: flex; }
.pickup-swatch {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 1px solid #E0E0E0;
  flex-shrink: 0;
}
.pickup-name { font-size: 13px; color: #333; }
.pickup-remove {
  margin-left: auto;
  font-size: 18px;
  color: #999;
  cursor: pointer;
  padding: 0 4px;
}

/* 底部抽屉 */
.drawer-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.drawer-panel {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 390px;
  max-height: 60vh;
  background: #fff;
  border-radius: 16px 16px 0 0;
  padding: 20px;
  z-index: 201;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
}
.drawer-panel.open {
  transform: translateX(-50%) translateY(0);
}
.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.drawer-header h3 { font-size: 16px; font-weight: 600; }
.drawer-close { font-size: 20px; cursor: pointer; color: #999; padding: 4px; }
.drawer-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.drawer-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  padding: 8px;
  border: 2px solid transparent;
  border-radius: 8px;
  transition: border-color 0.2s;
}
.drawer-item.selected { border-color: #000; }
.drawer-item .swatch {
  width: 60px;
  height: 80px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.drawer-item .name {
  font-size: 12px;
  color: #666;
  text-align: center;
}
.drawer-confirm {
  margin-top: 16px;
  width: 100%;
  height: 44px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
.drawer-confirm:disabled { background: #CCC; cursor: default; }

/* === AI 搭配按钮 === */
.ai-btn {
  display: block;
  width: calc(100% - 32px);
  margin: 0 16px 16px;
  height: 50px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.ai-btn:active { opacity: 0.8; }

/* === 搭配结果区 === */
.result-area { padding: 0 16px 16px; }

.empty-state {
  text-align: center; padding: 48px 0;
  color: #CCC;
}
.empty-icon { font-size: 36px; margin-bottom: 8px; }
.empty-text { font-size: 14px; }

/* 骨架屏 */
.skeleton-card { padding: 16px; border: 1px solid #F0F0F0; margin-bottom: 12px; }
.skeleton-block { height: 160px; background: #F5F5F5; margin-bottom: 12px; }
.skeleton-line { height: 12px; background: #F5F5F5; margin-bottom: 8px; border-radius: 2px; }
.skeleton-line.short { width: 60%; }
.shimmer {
  background: linear-gradient(90deg, #F5F5F5 25%, #ECECEC 50%, #F5F5F5 75%);
  background-size: 200% 100%;
  animation: shimmer2 1.2s infinite;
}
@keyframes shimmer2 { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* 标题行 */
.outfit-title-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.outfit-title-left { display: flex; align-items: center; gap: 6px; }
.outfit-star { color: #E8805A; font-size: 14px; }
.outfit-title-text { font-size: 15px; font-weight: 500; color: #1A1A1A; }
.outfit-slide-hint { font-size: 11px; color: #BBB; }

/* 横向滑动 */
.outfits-swiper {
  display: flex; gap: 12px;
  overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
}
.outfits-swiper::-webkit-scrollbar { display: none; }

/* 单套穿搭卡片 */
.outfit-card {
  min-width: calc(100% - 40px); scroll-snap-align: start;
  border: 1px solid #E8E8E8; border-radius: 12px; padding: 16px;
  background: #fff; flex-shrink: 0;
  transition: border-color 0.2s;
}
.outfit-card.active-card { border-color: #1A1A1A; }

/* 三张衣物图片横排 */
.outfit-clothes-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 14px;
}
.outfit-cloth-item { position: relative; }
.outfit-cloth-img {
  width: 100%; aspect-ratio: 3/4; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
.cloth-score-tag {
  position: absolute; top: 6px; right: 6px;
  background: rgba(232,128,90,0.9); color: #fff;
  font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 10px;
}

/* 风格标签 */
.outfit-style-tags {
  display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;
}
.outfit-style-tag {
  border: 1px solid #E0E0E0; border-radius: 20px;
  padding: 3px 10px; font-size: 11px; color: #555;
}

/* 搭配理由 */
.outfit-reason {
  font-size: 13px; color: #444; line-height: 1.7;
  margin-bottom: 14px;
}

/* 单品清单 */
.outfit-items-list { border-top: 1px solid #F0F0F0; padding-top: 12px; }
.outfit-item-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid #F8F8F8;
}
.outfit-item-left { display: flex; align-items: center; gap: 10px; }
.outfit-item-dot {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.08);
}
.outfit-item-name { font-size: 14px; color: #1A1A1A; font-weight: 300; }
.outfit-item-type { font-size: 12px; color: #999; }

/* 底部操作栏 */
.outfit-actions {
  display: flex; gap: 8px; margin-top: 16px;
}
.action-btn {
  flex: 1; height: 44px; border-radius: 10px;
  font-size: 13px; font-weight: 400; font-family: inherit;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  -webkit-tap-highlight-color: transparent;
}
.tryon-btn { background: #FFF5F2; color: #E8805A; border: 1px solid #F5C4B0; flex: 1.3; }
.fav-btn { background: #fff; color: #555; border: 1px solid #E0E0E0; }
.wear-btn { background: #fff; color: #E8805A; border: 1px solid #E8805A; }
.fav-btn.saved { color: #E8805A; }
.wear-btn.worn { background: #E8805A; color: #fff; }

/* === AI 试穿弹层 === */
.tryon-overlay {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.6); z-index: 400;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.tryon-overlay.open { opacity: 1; pointer-events: auto; }

.tryon-modal {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 390px;
  background: #fff; border-radius: 24px 24px 0 0;
  padding: 20px 20px 32px; z-index: 401;
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 92vh; overflow-y: auto;
}
.tryon-modal.open { transform: translateX(-50%) translateY(0); }

.tryon-header {
  display: flex; align-items: center; margin-bottom: 16px;
}
.tryon-title { font-size: 17px; font-weight: 600; color: #1A1A1A; flex: 1; }
.tryon-demo-tag {
  background: #FFF0EB; color: #E8805A;
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
  margin-right: 10px;
}
.tryon-close { font-size: 20px; color: #999; cursor: pointer; padding: 4px; }

.tryon-model-switch {
  display: flex; background: #F5F5F5; border-radius: 10px; padding: 3px;
  margin-bottom: 16px; gap: 3px;
}
.model-tab {
  flex: 1; height: 36px; border-radius: 8px; border: none;
  font-size: 12px; font-family: inherit; font-weight: 300;
  background: transparent; color: #999; cursor: pointer; transition: all 0.2s;
}
.model-tab.active { background: #fff; color: #1A1A1A; font-weight: 400; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

.tryon-image-wrap {
  width: 100%; aspect-ratio: 3/4; border-radius: 16px;
  overflow: hidden; background: #F5F0EB; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center;
}

.tryon-placeholder-body { width: 80px; height: 160px; background: #D4C5B0; border-radius: 40px 40px 20px 20px; opacity: 0.4; }
.tryon-loading-text { font-size: 16px; color: #999; text-align: center; margin-top: 12px; }
.tryon-caption { font-size: 12px; color: #999; text-align: center; margin-bottom: 16px; }

.tryon-actions { display: flex; gap: 8px; }
.tryon-action-btn {
  flex: 1; height: 48px; border-radius: 12px;
  font-size: 14px; font-family: inherit; font-weight: 400;
  cursor: pointer; transition: all 0.15s; display: flex;
  align-items: center; justify-content: center; gap: 4px;
  border: 1px solid #E0E0E0; background: #fff; color: #555;
}
.tryon-action-btn.primary { background: #E8805A; color: #fff; border-color: #E8805A; flex: 1.3; }

/* 绿色提示条 */
.toast-success {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #4CAF50;
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 150;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast-success.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 底部Tab */
.bottom-tab {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 64px;
  background: #fff;
  border-top: 1px solid #F0F0F0;
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  font-size: 10px;
  color: #999;
  padding: 4px 12px;
  cursor: pointer;
}
.tab-item .icon { font-size: 22px; margin-bottom: 2px; }
.tab-item.active { color: #000; }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部导航 -->
  <header class="header">
    <h1>WARDROBE</h1>
  </header>

  <!-- 内容区 -->
  <div class="content">

    <!-- 1. 场合选择 -->
    <div class="occasion-section">
      <div class="section-title">今天去哪里？</div>
      <div class="tags-scroll" id="occasionTags">
        <span class="tag" data-val="日常">日常</span>
        <span class="tag active" data-val="职场">职场</span>
        <span class="tag" data-val="约会">约会</span>
        <span class="tag" data-val="聚会">聚会</span>
        <span class="tag" data-val="运动">运动</span>
      </div>
      <input class="custom-input" id="customOccasion" type="text" placeholder="或输入自定义场景，如：参加朋友婚礼、海边旅行…">
    </div>

    <!-- 2. 天气卡片 -->
    <div class="weather-card-section">
      <div class="weather-card" id="weatherCard">
        <div class="weather-card-left">
          <div class="weather-city-row">
            <span class="weather-city-icon">⊙</span>
            <span class="weather-city-name" id="weatherCityName">上海</span>
            <span class="weather-city-dot">·</span>
            <span class="weather-city-today">今日</span>
            <span class="weather-city-arrow">∨</span>
          </div>
          <div class="weather-temp" id="weatherTemp">16° / 25°</div>
          <div class="weather-desc" id="weatherDesc">多云 · UV 中</div>
        </div>
        <div class="weather-card-right">
          <div class="weather-icon" id="weatherIcon">⛅</div>
        </div>
      </div>
    </div>

    <!-- 城市选择弹窗 -->
    <div class="city-overlay" id="cityOverlay"></div>
    <div class="city-modal" id="cityModal">
      <div class="city-modal-header">
        <span class="city-modal-title">选择城市</span>
        <span class="city-modal-close" id="cityClose">✕</span>
      </div>
      <input class="city-search-input" id="citySearchInput" type="text" placeholder="搜索城市，如 北京 / Tokyo" autocomplete="off">
      <button class="city-locate-btn" id="cityLocateBtn">⊙ 使用当前定位</button>
    </div>

    <!-- 3. 指定单品 -->
    <div class="pickup-section">
      <div class="section-title">想穿某件？（可选）</div>
      <button class="pickup-btn" id="pickupBtn">+ 从衣橱选择</button>
      <div class="pickup-selected" id="pickupSelected">
        <span class="pickup-swatch" id="pickupSwatch"></span>
        <span class="pickup-name" id="pickupName"></span>
        <span class="pickup-remove" id="pickupRemove">×</span>
      </div>
    </div>

    <!-- 4. AI 搭配按钮 -->
    <button class="ai-btn" id="aiBtn">✨ AI 帮我搭配</button>

    <!-- 5. 搭配结果 -->
    <div class="result-area" id="resultArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🧥</div>
        <div class="empty-text">选好条件，开始搭配</div>
      </div>
      <div class="skeleton-area" id="skeletonArea" style="display:none;">
        <div class="skeleton-card">
          <div class="skeleton-block shimmer"></div>
          <div class="skeleton-line shimmer"></div>
          <div class="skeleton-line short shimmer"></div>
        </div>
      </div>
      <div class="outfits-result" id="outfitsResult" style="display:none;">
        <div class="outfit-title-row">
          <div class="outfit-title-left">
            <span class="outfit-star">✦</span>
            <span class="outfit-title-text" id="outfitTitleText">为你生成的 3 套 · 第 1 套</span>
          </div>
          <span class="outfit-slide-hint">左右滑动切换</span>
        </div>
        <div class="outfits-swiper" id="outfitsSwiper"></div>
        <div class="outfit-actions">
          <button class="action-btn tryon-btn" id="tryOnBtn">⚡ 一键试穿</button>
          <button class="action-btn fav-btn" id="favBtn">♡ 收藏</button>
          <button class="action-btn wear-btn" id="wearBtn">✓ 就穿它</button>
        </div>
      </div>
    </div>

    <!-- AI试穿弹层 -->
    <div class="tryon-overlay" id="tryonOverlay"></div>
    <div class="tryon-modal" id="tryonModal">
      <div class="tryon-header">
        <span class="tryon-title">✦ AI 一键试穿</span>
        <span class="tryon-demo-tag">DEMO</span>
        <span class="tryon-close" id="tryonClose">✕</span>
      </div>
      <div class="tryon-model-switch">

<script>
// ============ 数据 ============
const mockItems = [
  { name: '白色衬衫', color: '#E8E8E8' },
  { name: '灰色卫衣', color: '#9E9E9E' },
  { name: '黑色西裤', color: '#2C2C2C' },
  { name: '深蓝牛仔裤', color: '#2B4B7A' },
  { name: '切尔西靴', color: '#1A1A1A' },
  { name: '帆布鞋', color: '#F5F5DC' }
];

const plans = [
  {
    name: '方案一',
    items: [
      { name: '白色衬衫', color: '#E8E8E8' },
      { name: '黑色西裤', color: '#2C2C2C' },
      { name: '切尔西靴', color: '#1A1A1A' }
    ],
    reason: '经典黑白组合，职场首选，干净利落'
  },
  {
    name: '方案二',
    items: [
      { name: '灰色卫衣', color: '#9E9E9E' },
      { name: '深蓝牛仔裤', color: '#2B4B7A' },
      { name: '切尔西靴', color: '#1A1A1A' }
    ],
    reason: '休闲商务风，舒适不失整洁'
  },
  {
    name: '方案三',
    items: [
      { name: '白色衬衫', color: '#E8E8E8' },
      { name: '深蓝牛仔裤', color: '#2B4B7A' },
      { name: '切尔西靴', color: '#1A1A1A' }
    ],
    reason: '轻松通勤感，衬衫扎进裤腰可提升正式感'
  }
];

// ============ 状态 ============
let selectedOccasion = '职场';
let customOccasion = '';
let selectedWeather = '多云';
let selectedTemp = '16-25°';
let weatherCity = '上海';
let selectedItem = null;

// ============ DOM ============
const occasionTagsEl = document.getElementById('occasionTags');
const customInput = document.getElementById('customOccasion');
const pickupBtn = document.getElementById('pickupBtn');
const pickupSelectedEl = document.getElementById('pickupSelected');
const pickupSwatchEl = document.getElementById('pickupSwatch');
const pickupNameEl = document.getElementById('pickupName');
const pickupRemove = document.getElementById('pickupRemove');
const toastSuccess = document.getElementById('toastSuccess');
const drawerOverlay = document.getElementById('drawerOverlay');
const drawerPanel = document.getElementById('drawerPanel');
const drawerClose = document.getElementById('drawerClose');
const drawerGrid = document.getElementById('drawerGrid');
const drawerConfirm = document.getElementById('drawerConfirm');

// ============ 场合标签 ============
occasionTagsEl.addEventListener('click', (e) => {
  const tag = e.target.closest('.tag');
  if (!tag) return;
  // 清空自定义输入
  customInput.value = '';
  customOccasion = '';
  // 切换选中
  occasionTagsEl.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
  tag.classList.add('active');
  selectedOccasion = tag.dataset.val;
});

// ============ 自定义输入 ============
customInput.addEventListener('input', (e) => {
  const val = e.target.value.trim();
  customOccasion = val;
  if (val) {
    occasionTagsEl.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    selectedOccasion = val;
  }
});

// ============ 天气卡片 & 城市弹窗 ============
const weatherCard = document.getElementById('weatherCard');
const cityOverlay = document.getElementById('cityOverlay');
const cityModal = document.getElementById('cityModal');
const cityClose = document.getElementById('cityClose');
const citySearchInput = document.getElementById('citySearchInput');
const cityLocateBtn = document.getElementById('cityLocateBtn');
const weatherCityName = document.getElementById('weatherCityName');
const weatherTemp = document.getElementById('weatherTemp');
const weatherDesc = document.getElementById('weatherDesc');
const weatherIcon = document.getElementById('weatherIcon');

// 打开城市选择弹窗
weatherCard.addEventListener('click', () => {
  citySearchInput.value = '';
  cityOverlay.classList.add('open');
  cityModal.classList.add('open');
  setTimeout(() => citySearchInput.focus(), 300);
});

function closeCityModal() {
  cityOverlay.classList.remove('open');
  cityModal.classList.remove('open');
}
cityClose.addEventListener('click', closeCityModal);
cityOverlay.addEventListener('click', closeCityModal);

// 搜索城市（按回车/失焦）
citySearchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const city = citySearchInput.value.trim();
    if (city) { fetchWeatherByCity(city); closeCityModal(); }
  }
});

// 使用当前定位
cityLocateBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    showToast('浏览器不支持定位');
    return;
  }
  cityLocateBtn.textContent = '定位中...';
  cityLocateBtn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(4);
      const lon = pos.coords.longitude.toFixed(4);
      closeCityModal();
      fetchWeatherByCoords(lat, lon);
    },
    () => {
      cityLocateBtn.textContent = '⊙ 使用当前定位';
      cityLocateBtn.classList.remove('loading');
      showToast('无法获取定位，请手动搜索城市');
    },
    { timeout: 8000 }
  );
});

function fetchWeatherByCity(city) {
  fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`)
    .then(r => r.json())
    .then(data => applyWeatherData(data, city))
    .catch(() => showToast('城市天气获取失败，请重试'));
}

function fetchWeatherByCoords(lat, lon) {
  fetch(`https://wttr.in/${lat},${lon}?format=j1`)
    .then(r => r.json())
    .then(data => {
      const area = data.nearest_area?.[0];
      const city = area?.areaName?.[0]?.value || '当前位置';
      applyWeatherData(data, city);
      cityLocateBtn.textContent = '⊙ 使用当前定位';
      cityLocateBtn.classList.remove('loading');
    })
    .catch(() => {
      showToast('天气获取失败，请重试');
      cityLocateBtn.textContent = '⊙ 使用当前定位';
      cityLocateBtn.classList.remove('loading');
    });
}

function applyWeatherData(data, city) {
  const c = data.current_condition[0];
  const minTemp = data.weather?.[0]?.mintempC || c.temp_C;
  const maxTemp = data.weather?.[0]?.maxtempC || c.temp_C;
  const desc = c.weatherDesc[0].value;

  weatherCity = city;
  weatherCityName.textContent = city;
  weatherTemp.textContent = `${minTemp}° / ${maxTemp}°`;

  // UV 判断
  const uv = parseInt(c.uvIndex || 0);
  const uvText = uv >= 8 ? 'UV 极强' : uv >= 6 ? 'UV 强' : uv >= 3 ? 'UV 中' : 'UV 低';

  // 天气中文描述
  let zhDesc, icon;
  if (/rain|drizzle/i.test(desc)) {
    zhDesc = '有雨'; icon = '🌧'; selectedWeather = '雨天';
  } else if (/snow/i.test(desc)) {
    zhDesc = '有雪'; icon = '❄️'; selectedWeather = '阴天';
  } else if (/thunder/i.test(desc)) {
    zhDesc = '雷雨'; icon = '⛈'; selectedWeather = '雨天';
  } else if (/overcast/i.test(desc)) {
    zhDesc = '阴天'; icon = '☁️'; selectedWeather = '阴天';
  } else if (/cloud/i.test(desc)) {
    zhDesc = '多云'; icon = '⛅'; selectedWeather = '多云';
  } else if (/fog|mist/i.test(desc)) {
    zhDesc = '有雾'; icon = '🌫'; selectedWeather = '阴天';
  } else {
    zhDesc = '晴天'; icon = '☀️'; selectedWeather = '晴天';
  }

  weatherDesc.textContent = `${zhDesc} · ${uvText}`;
  weatherIcon.textContent = icon;

  const avg = (parseInt(minTemp) + parseInt(maxTemp)) / 2;
  if (avg < 10) selectedTemp = '＜10°';
  else if (avg < 20) selectedTemp = '10-20°';
  else if (avg < 30) selectedTemp = '20-30°';
  else selectedTemp = '＞30°';
}

// ============ 抽屉渲染 ============
function renderDrawer() {
  drawerGrid.innerHTML = mockItems.map((item, i) => `
    <div class="drawer-item" data-index="${i}">
      <div class="swatch" style="background:${item.color}"></div>
      <span class="name">${item.name}</span>
    </div>
  `).join('');
}
renderDrawer();

// 抽屉选中的 item
let drawerSelected = null;

drawerGrid.addEventListener('click', (e) => {
  const item = e.target.closest('.drawer-item');
  if (!item) return;
  const idx = parseInt(item.dataset.index);
  drawerGrid.querySelectorAll('.drawer-item').forEach(el => el.classList.remove('selected'));
  item.classList.add('selected');
  drawerSelected = mockItems[idx];
  drawerConfirm.disabled = false;
});

pickupBtn.addEventListener('click', () => {
  drawerSelected = null;
  drawerConfirm.disabled = true;
  drawerGrid.querySelectorAll('.drawer-item').forEach(el => el.classList.remove('selected'));
  drawerOverlay.classList.add('open');
  drawerPanel.classList.add('open');
});

function closeDrawer() {
  drawerOverlay.classList.remove('open');
  drawerPanel.classList.remove('open');
}
drawerClose.addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

drawerConfirm.addEventListener('click', () => {
  if (!drawerSelected) return;
  selectedItem = drawerSelected;
  pickupSwatchEl.style.background = selectedItem.color;
  pickupNameEl.textContent = selectedItem.name;
  pickupSelectedEl.classList.add('show');
  closeDrawer();
});

pickupRemove.addEventListener('click', () => {
  selectedItem = null;
  pickupSelectedEl.classList.remove('show');
});

// ============ Toast 提示 ============
function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = `
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.75); color:#fff; padding:8px 18px;
    border-radius:16px; font-size:12px; z-index:500; white-space:nowrap;
  `;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function showToastSuccess() {
  toastSuccess.classList.add('show');
  setTimeout(() => { toastSuccess.classList.remove('show'); }, 2500);
}

// ============ 搭配结果 ============
const outfitsResult = document.getElementById('outfitsResult');
const outfitsSwiper = document.getElementById('outfitsSwiper');
const outfitTitleText = document.getElementById('outfitTitleText');
const skeletonArea = document.getElementById('skeletonArea');
const emptyState = document.getElementById('emptyState');
const tryOnBtn = document.getElementById('tryOnBtn');
const favBtn = document.getElementById('favBtn');
const wearBtn = document.getElementById('wearBtn');

// Mock 3套搭配数据
const outfitsData = [
  {
    name: '方案一',
    styles: ['极简', '职场'],
    reason: '22°C的阴天通勤，这身极简职场风拿捏得刚好：白色衬衫利落大方，黑色西裤经典百搭，切尔西靴收尾干净不拖泥带水，整体清爽又不失正式感。',
    items: [
      { name: '白色宽松衬衫', type: '上装', color: '#E8E8E8', score: null },
      { name: '黑色直筒西裤', type: '下装', color: '#2C2C2C', score: null },
      { name: '黑色切尔西靴', type: '鞋履', color: '#1A1A1A', score: '85% · 极佳' }
    ]
  },
  {
    name: '方案二',
    styles: ['休闲', '街头'],
    reason: '22°C的天气穿这套刚刚好：灰色卫衣带点随性，深蓝牛仔裤经典百搭，切尔西靴提升整体质感，休闲中不失品位，走在街头自然有型。',
    items: [
      { name: '灰色圆领卫衣', type: '上装', color: '#9E9E9E', score: null },
      { name: '深蓝牛仔裤', type: '下装', color: '#2B4B7A', score: null },
      { name: '黑色切尔西靴', type: '鞋履', color: '#1A1A1A', score: '78% · 良好' }
    ]
  },
  {
    name: '方案三',
    styles: ['简约', '通勤'],
    reason: '白色衬衫搭深蓝牛仔裤，是永远不会出错的组合。衬衫微扎进裤腰可提升正式感，配切尔西靴整体感更强，轻松应对各种通勤场景。',
    items: [
      { name: '白色宽松衬衫', type: '上装', color: '#E8E8E8', score: null },
      { name: '深蓝牛仔裤', type: '下装', color: '#2B4B7A', score: null },
      { name: '黑色切尔西靴', type: '鞋履', color: '#1A1A1A', score: '80% · 良好' }
    ]
  }
];

// 衣物emoji图标（用于色块背景中的图标）
const clothEmoji = { '上装': '👕', '下装': '👖', '鞋履': '👟', '外套': '🧥', '配饰': '👜' };

let currentOutfitIndex = 0;

function renderOutfits() {
  outfitsSwiper.innerHTML = '';
  outfitsData.forEach((outfit, idx) => {
    const card = document.createElement('div');
    card.className = 'outfit-card' + (idx === 0 ? ' active-card' : '');
    card.dataset.index = idx;

    // 三张衣物图
    const clothRow = document.createElement('div');
    clothRow.className = 'outfit-clothes-row';
    outfit.items.forEach(item => {
      const wrap = document.createElement('div');
      wrap.className = 'outfit-cloth-item';
      const imgBox = document.createElement('div');
      imgBox.className = 'outfit-cloth-img';
      imgBox.style.background = item.color;
      imgBox.style.fontSize = '28px';
      imgBox.textContent = clothEmoji[item.type] || '👔';
      wrap.appendChild(imgBox);
      if (item.score) {
        const tag = document.createElement('div');
        tag.className = 'cloth-score-tag';
        tag.textContent = item.score;
        wrap.appendChild(tag);
      }
      clothRow.appendChild(wrap);
    });

    // 风格标签
    const tagRow = document.createElement('div');
    tagRow.className = 'outfit-style-tags';
    outfit.styles.forEach(s => {
      const t = document.createElement('span');
      t.className = 'outfit-style-tag';
      t.textContent = s;
      tagRow.appendChild(t);
    });

    // 理由
    const reason = document.createElement('div');
    reason.className = 'outfit-reason';
    reason.textContent = outfit.reason;

    // 单品清单
    const list = document.createElement('div');
    list.className = 'outfit-items-list';
    outfit.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'outfit-item-row';
      const left = document.createElement('div');
      left.className = 'outfit-item-left';
      const dot = document.createElement('div');
      dot.className = 'outfit-item-dot';
      dot.style.background = item.color;
      const name = document.createElement('span');
      name.className = 'outfit-item-name';
      name.textContent = item.name;
      left.appendChild(dot);
      left.appendChild(name);
      const type = document.createElement('span');
      type.className = 'outfit-item-type';
      type.textContent = item.type;
      row.appendChild(left);
      row.appendChild(type);
      list.appendChild(row);
    });

    card.appendChild(clothRow);
    card.appendChild(tagRow);
    card.appendChild(reason);
    card.appendChild(list);
    outfitsSwiper.appendChild(card);
  });

  // 滑动监听，更新标题
  outfitsSwiper.addEventListener('scroll', () => {
    const scrollLeft = outfitsSwiper.scrollLeft;
    const cardWidth = outfitsSwiper.clientWidth;
    const newIndex = Math.round(scrollLeft / (cardWidth + 12));
    if (newIndex !== currentOutfitIndex) {
      currentOutfitIndex = newIndex;
      outfitTitleText.textContent = `为你生成的 3 套 · 第 ${currentOutfitIndex + 1} 套`;
      document.querySelectorAll('.outfit-card').forEach((c, i) => {
        c.classList.toggle('active-card', i === currentOutfitIndex);
      });
    }
  }, { passive: true });
}

// 重新绑定 AI 搭配按钮
const aiBtn = document.getElementById('aiBtn');
if (aiBtn) {
  // 移除旧监听（克隆替换）
  const newAiBtn = aiBtn.cloneNode(true);
  aiBtn.parentNode.replaceChild(newAiBtn, aiBtn);
  newAiBtn.addEventListener('click', () => {
    emptyState.style.display = 'none';
    outfitsResult.style.display = 'none';
    skeletonArea.style.display = 'block';
    setTimeout(() => {
      skeletonArea.style.display = 'none';
      outfitsResult.style.display = 'block';
      currentOutfitIndex = 0;
      outfitTitleText.textContent = '为你生成的 3 套 · 第 1 套';
      renderOutfits();
      favBtn.textContent = '♡ 收藏';
      favBtn.classList.remove('saved');
      wearBtn.textContent = '✓ 就穿它';
      wearBtn.classList.remove('worn');
    }, 1500);
  });
}

tryOnBtn.addEventListener('click', () => {

});

function closeTryon() {

tryonClose.addEventListener('click', closeTryon);

tabSelf.addEventListener('click', () => {
  tabSelf.classList.add('active');

});

tryonRegen.addEventListener('click', () => {
  showToast('重新生成中（演示版）');
});
tryonFavBtn.addEventListener('click', () => {
  showToast('已收藏试穿效果');
  tryonFavBtn.textContent = '♡ 已收藏';
});
tryonWear.addEventListener('click', () => {
  closeTryon();

  wearBtn.classList.add('worn');
  showToast('已记录今日穿搭 ✓');
});

// 收藏按钮
favBtn.addEventListener('click', () => {
  const outfit = outfitsData[currentOutfitIndex];
  const item = {
    id: Date.now(),
    outfitName: outfit.name,
    items: outfit.items.map(i => ({ name: i.name, color: i.color })),
    occasion: '职场',
    weather: '晴天',
    tags: outfit.styles,
    savedAt: new Date().toISOString()
  };
  let favorites = [];
  try { favorites = JSON.parse(localStorage.getItem('favorites') || '[]'); } catch(e){}
  favorites.unshift(item);
  localStorage.setItem('favorites', JSON.stringify(favorites));
  favBtn.textContent = '❤️ 已收藏';
  favBtn.classList.add('saved');
  showToast('已收藏到「收藏」页');
});

// 就穿它
wearBtn.addEventListener('click', () => {
  localStorage.setItem('today_outfit', JSON.stringify(outfitsData[currentOutfitIndex]));
  wearBtn.textContent = '✓ 已选择';
  wearBtn.classList.add('worn');
  showToast('今日穿搭已记录 ✓');
});
</script>
